apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matomo.fullname" . }}-config
  labels:
    {{- include "matomo.labels" . | nindent 4 }}
data:
  # Matomo has no environment variable for trusted proxies - client-IP trust must be set in
  # config/common.config.ini.php. That file is merged over global.ini.php and is NEVER
  # rewritten by the installer or admin UI (only config.ini.php is), so it is the safe place
  # for platform-managed settings. Behind the platform Traefik ingress the TCP peer is a
  # Traefik pod IP (k3s pod CIDR 10.42.0.0/16, inside 10.0.0.0/8); proxy_ips trusts the
  # RFC1918 super-set so Matomo discards the proxy hop and records the real visitor IP from
  # X-Forwarded-For instead of the pod IP. If an external load balancer fronts the cluster,
  # add its CIDR to proxy_ips as well (do not hardcode an LB IP here).
  common.config.ini.php: |
    ; <?php exit; ?> DO NOT REMOVE THIS LINE
    ; Managed by the Insula platform - do not edit in the Matomo UI (this file is not UI-writable).
    [General]
    proxy_client_headers[] = "HTTP_X_FORWARDED_FOR"
    proxy_client_headers[] = "HTTP_X_REAL_IP"
    proxy_ips[] = "10.0.0.0/8"
    proxy_ips[] = "172.16.0.0/12"
    proxy_ips[] = "192.168.0.0/16"
    proxy_ips[] = "fd00::/8"

moodle:
  # erseco/alpine-moodle: all-in-one Alpine + PHP 8.3 + nginx Moodle image.
  # Runs the Moodle cron loop internally (RUN_CRON_TASKS) — no separate CronJob.
  image: erseco/alpine-moodle:v5.2.0
  replicas: 1
  username: "admin"
  password: ""
  email: ""
  siteName: "Moodle"
  # Public URL Moodle advertises. When ingress.domain is set the chart derives
  # https://<domain>; this value is the fallback for domain-less installs.
  siteUrl: "http://localhost:8080"
  dataStorageSize: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

postgresql:
  image: postgres:18-alpine
  port: 5432
  database: moodle
  user: moodle
  password: ""
  storageSize: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: true
  domain: ""
  tls: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"

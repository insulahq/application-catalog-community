apiVersion: v1
kind: Service
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
    app.kubernetes.io/component: moodle
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "moodle-bitnami.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: moodle
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}-postgresql
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "moodle-bitnami.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql

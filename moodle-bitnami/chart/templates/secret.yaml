apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}-secret
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL password — shared by the postgres container (POSTGRES_PASSWORD) and
  # Moodle (DB_PASS). MOODLE_PASSWORD is the initial site-admin password.
  postgres-password: {{ .Values.postgresql.password | quote }}
  moodle-password: {{ .Values.moodle.password | quote }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}-moodle
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moodle-bitnami.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: moodle
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}-postgresql
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moodle-bitnami.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "moodle-bitnami.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: moodle
      ports:
        - port: 5432
          protocol: TCP

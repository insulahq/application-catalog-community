apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}-postgresql
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  replicas: 1
  # Single ReadWriteOnce data volume — never run two instances against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "moodle-bitnami.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "moodle-bitnami.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moodle-bitnami.fullname" . }}-secret
                  key: postgres-password
          # postgres:18-alpine ships PGDATA=/var/lib/postgresql/18/docker and declares
          # VOLUME /var/lib/postgresql, so we mount the whole directory (matching the
          # manifest "database" volume at /var/lib/postgresql) and leave PGDATA at its
          # image default rather than pinning a legacy /var/lib/postgresql/data path.
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.user | quote }}
                - -d
                - {{ .Values.postgresql.database | quote }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.user | quote }}
                - -d
                - {{ .Values.postgresql.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.postgresql.resources.requests.cpu }}
              memory: {{ .Values.postgresql.resources.requests.memory }}
            limits:
              cpu: {{ .Values.postgresql.resources.limits.cpu }}
              memory: {{ .Values.postgresql.resources.limits.memory }}
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "moodle-bitnami.fullname" . }}-postgresql

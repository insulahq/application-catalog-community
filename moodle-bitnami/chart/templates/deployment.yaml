apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moodle-bitnami.fullname" . }}
  labels:
    {{- include "moodle-bitnami.labels" . | nindent 4 }}
    app.kubernetes.io/component: moodle
spec:
  replicas: {{ .Values.moodle.replicas }}
  selector:
    matchLabels:
      {{- include "moodle-bitnami.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: moodle
  # moodledata is a ReadWriteOnce PVC, so a second pod cannot mount it during a
  # rolling update — recreate the old pod before starting the new one.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "moodle-bitnami.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: moodle
    spec:
      containers:
        - name: moodle
          image: {{ .Values.moodle.image }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # PostgreSQL connection (erseco reads the DB_* set; POSTGRES_* mirror the
            # manifest env_vars so the app and DB share one source of truth).
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moodle-bitnami.fullname" . }}-secret
                  key: postgres-password
            - name: DB_TYPE
              value: "pgsql"
            - name: DB_HOST
              value: {{ include "moodle-bitnami.fullname" . }}-postgresql
            - name: DB_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "moodle-bitnami.fullname" . }}-secret
                  key: postgres-password
            # Site admin + identity
            - name: MOODLE_USERNAME
              value: {{ .Values.moodle.username | quote }}
            - name: MOODLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moodle-bitnami.fullname" . }}-secret
                  key: moodle-password
            - name: MOODLE_EMAIL
              value: {{ .Values.moodle.email | quote }}
            - name: MOODLE_SITENAME
              value: {{ .Values.moodle.siteName | quote }}
            - name: SITE_URL
              value: {{ if .Values.ingress.domain }}{{ printf "https://%s" .Values.ingress.domain | quote }}{{ else }}{{ .Values.moodle.siteUrl | quote }}{{ end }}
            # Reverse-proxy awareness: TLS is terminated in-cluster (Traefik/nginx ingress),
            # and the TCP peer erseco sees is an ingress pod, not the visitor. SSLPROXY=true
            # tells Moodle its external scheme is https; REVERSEPROXY=true makes the bundled
            # nginx honor X-Forwarded-For / X-Forwarded-Proto so Moodle logs the real client
            # IP and builds correct absolute URLs instead of using the proxy pod IP.
            - name: SSLPROXY
              value: "true"
            - name: REVERSEPROXY
              value: "true"
            # erseco applies pending Moodle upgrades on boot and runs the Moodle cron loop
            # inside this container, so no separate upgrade step or CronJob is needed.
            - name: AUTO_UPDATE_MOODLE
              value: "true"
            - name: RUN_CRON_TASKS
              value: "true"
          volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
          resources:
            requests:
              cpu: {{ .Values.moodle.resources.requests.cpu }}
              memory: {{ .Values.moodle.resources.requests.memory }}
            limits:
              cpu: {{ .Values.moodle.resources.limits.cpu }}
              memory: {{ .Values.moodle.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /login/index.php
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /login/index.php
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: moodledata
          persistentVolumeClaim:
            claimName: {{ include "moodle-bitnami.fullname" . }}-moodledata
